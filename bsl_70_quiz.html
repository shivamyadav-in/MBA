/* ================================================================
   RUNTIME VALIDATION — fires before quiz starts
   ================================================================ */
(function validate(){
  var errs=[];
  if(!Array.isArray(qs)||qs.length===0){errs.push("qs array is empty or undefined.");}
  else{
    for(var i=0;i<qs.length;i++){
      var q=qs[i];
      if(!q.u||q.u.trim()==='') errs.push("Q"+(i+1)+": unit label missing");
      if(!q.q||q.q.trim()==='') errs.push("Q"+(i+1)+": question text empty");
      if(!Array.isArray(q.opts)||q.opts.length<2) errs.push("Q"+(i+1)+": opts must have >=2 items");
      if(typeof q.ans!=='number') errs.push("Q"+(i+1)+": ans must be a number");
      if(!q.exp||q.exp.trim()==='') errs.push("Q"+(i+1)+": explanation empty");
      if(typeof q.ans==='number'&&Array.isArray(q.opts)){
        if(q.ans<0||q.ans>=q.opts.length)
          errs.push("Q"+(i+1)+": ans="+q.ans+" OUT OF RANGE (opts="+q.opts.length+", valid 0–"+(q.opts.length-1)+")");
      }
      if(Array.isArray(q.opts)){
        for(var j=0;j<q.opts.length;j++){
          if(!q.opts[j]||q.opts[j].trim()==='') errs.push("Q"+(i+1)+": option "+j+" empty");
        }
      }
    }
  }
  if(errs.length>0){
    window.__quizHasErrors=true;
    document.addEventListener('DOMContentLoaded',function(){
      document.getElementById('area').innerHTML=
        '<div class="err-banner"><strong>\u26A0 Quiz Data Errors ('+errs.length+'):</strong>'+
        errs.map(function(e){return '<br>\u2022 '+e;}).join('')+'</div>';
    });
  }
})();

/* ── QUIZ ENGINE ── */
var cur=0,score=0,answered=false;

function showSplash(){
  if(window.__quizHasErrors)return;
  var total=qs.length;
  var csCount=qs.filter(function(q){return q.cs;}).length;
  var units={};qs.forEach(function(q){units[q.u]=1;});
  var numUnits=Object.keys(units).length;
  var html='<div class="splash">';
  html+='<div class="splash-icon">\u2696\uFE0F</div>';
  html+='<div class="splash-title">Business, Society &amp; Law</div>';
  html+='<div class="splash-sub">A comprehensive test across all 14 units \u2014 from business environment and economic policies to WTO, consumer laws, financial markets, and sustainability.</div>';
  html+='<div class="splash-stats">';
  html+='<div class="splash-stat"><div class="splash-stat-v">'+total+'</div><div class="splash-stat-l">Questions</div></div>';
  html+='<div class="splash-stat"><div class="splash-stat-v">'+numUnits+'</div><div class="splash-stat-l">Units</div></div>';
  html+='<div class="splash-stat"><div class="splash-stat-v">'+csCount+'</div><div class="splash-stat-l">Case Studies</div></div>';
  html+='</div>';
  html+='<button class="start-btn" onclick="startQuiz()">Start Quiz \u2192</button>';
  html+='</div>';
  document.getElementById('area').innerHTML=html;
  document.getElementById('prog').style.width='0%';
  document.getElementById('hbadge').textContent=total+' Questions';
}

function startQuiz(){
  if(window.__quizHasErrors)return;
  cur=0;score=0;answered=false;render();
}

function render(){
  if(cur>=qs.length){showResult();return;}
  var q=qs[cur];
  document.getElementById('prog').style.width=(cur/qs.length*100)+'%';
  document.getElementById('hbadge').textContent='Score: '+score+'/'+cur;
  var html='';
  html+='<div class="q-meta"><span class="q-counter">Q'+(cur+1)+' of '+qs.length+'</span></div>';
  html+='<div class="q-unit-tag">\uD83D\uDCD6 '+q.u+'</div>';
  if(q.cs) html+='<div class="case-badge">\uD83D\uDCCB Case Study</div>';
  html+='<div class="q-card"><div class="q-text">'+q.q+'</div></div>';
  html+='<div class="opts">';
  for(var i=0;i<q.opts.length;i++){
    html+='<button class="opt" onclick="choose('+i+')" id="o'+i+'">';
    html+='<span class="lbl">'+String.fromCharCode(65+i)+'</span>';
    html+='<span>'+q.opts[i]+'</span>';
    html+='</button>';
  }
  html+='</div>';
  html+='<div class="fb" id="fb"><span class="fb-head" id="fbh"></span><span id="fbt"></span></div>';
  html+='<div class="nxt-wrap" id="nw"><button class="nxt" onclick="next()">'+(cur<qs.length-1?'Next Question \u2192':'See My Results \u2192')+'</button></div>';
  document.getElementById('area').innerHTML=html;
}

function choose(i){
  if(answered)return;
  answered=true;
  var q=qs[cur];
  var btns=document.querySelectorAll('.opt');
  for(var b=0;b<btns.length;b++) btns[b].disabled=true;
  var ok=(i===q.ans);
  if(ok){document.getElementById('o'+i).className='opt correct';score++;}
  else{document.getElementById('o'+i).className='opt wrong';document.getElementById('o'+q.ans).className='opt correct';}
  var fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='fb '+(ok?'ok':'bad');
  document.getElementById('fbh').textContent=ok?'\u2713 Correct!':'\u2717 Incorrect';
  document.getElementById('fbt').textContent=q.exp;
  document.getElementById('nw').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function next(){cur++;answered=false;window.scrollTo({top:0,behavior:'smooth'});render();}

function showResult(){
  document.getElementById('prog').style.width='100%';
  document.getElementById('hbadge').textContent='Complete!';
  var total=qs.length,pct=Math.round(score/total*100),wrong=total-score;
  var grade,msg,emoji;
  if(score>=63){grade='Outstanding!';emoji='\uD83C\uDFC6';msg='Distinction-level. You have mastered Business, Society &amp; Law across all 14 units.';}
  else if(score>=56){grade='Excellent!';emoji='\uD83C\uDF1F';msg='Merit-level. Strong command from business environment to international institutions and sustainability.';}
  else if(score>=42){grade='Good Pass';emoji='\uD83D\uDC4D';msg='Solid understanding. Revisit Units 7, 11, and 12 for competition law, WTO, and international finance.';}
  else if(score>=28){grade='Getting There';emoji='\uD83D\uDCDA';msg='Keep going! Focus on monetary policy instruments, consumer laws, SEBI, and FDI frameworks.';}
  else{grade='Keep Going';emoji='\uD83D\uDCAA';msg='Revisit all 14 units and retake. Consistency will get you there!';}
  var html='<div class="result">';
  html+='<div class="result-ring"><div class="result-big">'+score+'/'+total+'</div><div class="result-pct">'+pct+'%</div></div>';
  html+='<div style="font-size:32px;margin-bottom:8px">'+emoji+'</div>';
  html+='<div class="result-grade">'+grade+'</div>';
  html+='<div class="result-msg">'+msg+'</div>';
  html+='<div class="stats">';
  html+='<div class="stat"><div class="stat-v" style="color:var(--green)">'+score+'</div><div class="stat-l">Correct</div></div>';
  html+='<div class="stat"><div class="stat-v" style="color:var(--red)">'+wrong+'</div><div class="stat-l">Wrong</div></div>';
  html+='<div class="stat"><div class="stat-v" style="color:var(--primary)">'+pct+'%</div><div class="stat-l">Score</div></div>';
  html+='</div>';
  html+='<button class="rst" onclick="restart()">\uD83D\uDD04 Retake Quiz</button>';
  html+='</div>';
  document.getElementById('area').innerHTML=html;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){cur=0;score=0;answered=false;showSplash();}
showSplash();
</script>
